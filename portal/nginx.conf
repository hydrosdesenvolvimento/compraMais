# nginx da landing pública (portal). Serve os estáticos e faz proxy do único endpoint público
# consumido pela página (GET /transparencia) ao backend, na mesma rede do Compose/Swarm.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker/Swarm — resolve `backend` em TEMPO DE REQUISIÇÃO (com o proxy_pass por
    # variável abaixo). Sem isso o nginx resolve no BOOT e aborta (`host not found in upstream`) se o
    # backend ainda não subiu, derrubando o container em Swarm (que ignora ordem de start).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cache dos assets estáticos da landing.
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API pública (mesma origem para o fetch do portal). Upstream por VARIÁVEL → resolução no request
    # (não no boot); URI fixa `/transparencia` (único endpoint público consumido pela landing).
    location = /transparencia {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:3000/transparencia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Injeta a base pública da aplicação nos CTAs (data-app-base) sem rebuild: o token
        # __APP_BASE__ do index.html é trocado por ${APP_BASE_URL} (resolvido no boot por envsubst).
        sub_filter '__APP_BASE__' '${APP_BASE_URL}';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }
}
