# nginx da landing pública (portal). Serve os estáticos e faz proxy do único endpoint público
# consumido pela página (GET /transparencia) ao backend, na mesma rede do Compose/Swarm.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache dos assets estáticos da landing.
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API pública (mesma origem para o fetch do portal). `proxy_pass` com URI fixa: só a transparência.
    location = /transparencia {
        proxy_pass http://backend:3000/transparencia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
